[package]
name = "cubemux-cube-viewer"
version = "0.1.0"
edition = "2021"
description = "wgpu transparent cube viewer for cubemux face textures"
license = "MIT"

[[bin]]
name = "cubemux-cube-viewer"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "23"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
